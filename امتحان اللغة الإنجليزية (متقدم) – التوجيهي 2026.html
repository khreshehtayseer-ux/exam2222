const app=document.getElementById('app'),md=document.getElementById('md');
let name='',viol=0,run=false,left=7200,tm;
function login(){app.innerHTML=`<div class="c"><h1>امتحان شهادة الدراسة الثانوية العامة 2026</h1><div class="m">اللغة الإنجليزية (متقدم) – نموذج (1) – ${T}</div>
<p>الأسئلة: 50 سؤالاً – العلامة من 100 – المدة: ساعتان</p>
<p class="m">⚠️ نظام منع الغش: الخروج من صفحة الامتحان أو التبديل إلى تطبيق آخر يعطيك <b>تنبيهاً واحداً</b>، وفي المرة الثانية يُنهى الامتحان تلقائياً.</p>
<input type="text" id="nm" placeholder="اكتب اسمك الثلاثي" autocomplete="off"><div id="er" style="color:var(--no)"></div>
<button onclick="start()">ابدأ الامتحان</button></div>`}
function start(){const v=document.getElementById('nm').value.trim().replace(/\s+/g,' ');
if(v.split(' ').length<3){document.getElementById('er').textContent='الرجاء إدخال الاسم الثلاثي كاملاً (ثلاث كلمات على الأقل).';return}
name=v;run=true;
let h=`<div id="bar"><span>${name}</span><span id="tt">02:00:00</span></div><div class="en" style="padding-top:10px">`;
Q.forEach((q,i)=>{h+=`<div class="c" id="q${i}">${q[0]?`<div class="p">${q[0]}</div>`:''}<b>${i+1}) ${q[1]}</b>`+q[2].map((o,j)=>`<label><input type="radio" name="r${i}" value="${j}"> ${'ABCD'[j]}) ${o}</label>`).join('')+`</div>`});
h+=`</div><div class="c" style="text-align:center"><button onclick="if(confirm('هل تريد تسليم الامتحان؟'))fin('تسليم')">تسليم الامتحان</button></div>`;
app.innerHTML=h;window.scrollTo(0,0);
tm=setInterval(()=>{left--;const s=n=>String(n).padStart(2,'0');document.getElementById('tt').textContent=s(left/3600|0)+':'+s(left%3600/60|0)+':'+s(left%60);if(left<=0)fin('انتهى الوقت')},1000)}
function viol_(){if(!run)return;viol++;if(viol==1)md.style.display='flex';else fin('تم إنهاء الامتحان بسبب الخروج من الصفحة للمرة الثانية')}
document.addEventListener('visibilitychange',()=>{if(document.hidden)viol_()});

['contextmenu','copy','cut','paste'].forEach(e=>document.addEventListener(e,x=>{if(run)x.preventDefault()}));
function fin(why){if(!run)return;run=false;md.style.display='none';clearInterval(tm);

app.innerHTML=`<div class="c" style="text-align:center"><div class="m">${why}</div><h1>${name}</h1><div class="big">${s*2} / 100</div><div class="m">الإجابات الصحيحة: ${s} من 50 – ${T}</div></div>${h}`;window.scrollTo(0,0)}
